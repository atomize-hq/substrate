version: 1
id: codex_world
config:
  kind: cli
  enabled: true
  protocol: substrate.agent.session
  execution:
    scope: world
  cli:
    runtime_family: codex
    binary: codex
    mode: persistent
  capabilities:
    session_start: true
    session_resume: true
    session_fork: true
    session_stop: true
    status_snapshot: true
    event_stream: true
    llm: true
    mcp_client: false
