# Lima configuration for Substrate world backend on macOS
# Copy this file to ~/.lima/substrate.yaml or use scripts/mac/lima-warm.sh to substitute PROJECT path.

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

vmType: "vz"
rosetta:
  enabled: true
cpus: 4
memory: "4GiB"
disk: "20GiB"
mounts: []
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eux
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        nftables iproute2 libseccomp-dev curl jq git python3 python3-pip \
        build-essential pkg-config libssl-dev dnsmasq openssh-server tmux unzip
      systemctl disable --now systemd-resolved || true
      cat >/etc/dnsmasq.d/substrate.conf <<'EOF'
      port=53
      listen-address=127.0.0.53
      bind-interfaces
      no-resolv
      server=1.1.1.1
      server=1.0.0.1
      cache-size=1000
      EOF
      echo 'nameserver 127.0.0.53' > /etc/resolv.conf
      sysctl -w kernel.unprivileged_userns_clone=1 || true
      mkdir -p /var/lib/substrate/overlay /run/substrate
      # Ensure hostname resolves locally to silence sudo warnings
      (hostnamectl set-hostname lima-substrate || true)
      grep -q 'lima-substrate' /etc/hosts || echo '127.0.1.1 lima-substrate' >> /etc/hosts
      # The canonical guest substrate-world-service.service/.socket authority is
      # installed later by scripts/mac/lima-warm.sh after guest creation so the
      # same rendered unit contract is used for fresh create and warm/repair.
