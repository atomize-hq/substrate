[package]
name = "world-backend-factory"
version = "0.1.0"
edition = "2021"
description = "Platform-aware factory returning Arc<dyn WorldBackend>"

[dependencies]
anyhow = { workspace = true }
transport-api-types = { version = "0.2.8", path = "../transport-api-types" }
world-api = { version = "0.1.0", path = "../world-api" }

[target.'cfg(target_os = "linux")'.dependencies]
world = { version = "0.1.1", path = "../world" }

[target.'cfg(target_os = "macos")'.dependencies]
world-mac-lima = { version = "0.1.0", path = "../world-mac-lima" }

[target.'cfg(target_os = "windows")'.dependencies]
world-windows-wsl = { version = "0.1.0", path = "../world-windows-wsl" }
