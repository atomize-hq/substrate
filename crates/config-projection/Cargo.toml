[package]
name = "config-projection"
version = "0.2.8"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[features]
default = []
test-support = []

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
transport-api-types = { version = "0.2.8", path = "../transport-api-types" }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3.0"
